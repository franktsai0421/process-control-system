function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const end=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+n,Math.min(d,end))).toISOString().slice(0,10)}
function reviewSignature(r){return JSON.stringify([r.id,r.mark,r.name,r.group,r.owner,r.unit,r.intake,r.enabled,r.method,r.channels,r.spec,r.notes])}
function reviewIsCurrent(r){return !!r.review?.resolved&&r.review.signature===reviewSignature(r)}
function pendingIssues(r){return reviewIsCurrent(r)?[]:(r.issues||[])}
function equipmentState(r,asOf=today()){
 if(isScrapped(r))return'報廢';
 if(!r.enabled)return'未啟用';
 if(pendingIssues(r).length||(r.statusConflict&&!reviewIsCurrent(r)))return'待確認';
 if(r.method==='不校正')return'不適用';
 const channels=r.channels||[];
 if(channels.some(c=>c.last&&c.expiry&&c.expiry<c.last))return'待確認';
 if(channels.some(c=>c.expiry&&c.expiry<asOf))return'已逾期';
 if(!channels.length||channels.some(c=>!c.cycle||!c.expiry))return'待補日期';
 const expiry=channels.map(c=>c.expiry).sort()[0];
 return expiry<=addMonths(asOf,1)?'一個月即將到期':expiry<=addMonths(asOf,2)?'2個月內即將到期':'有效';
}
function groupEditError({type,id,code,name,cat,sub,spec,reason,checked},d){
 const items=type==='category'?d.categories:type==='subcategory'?d.subcategories:d.groups;
 const old=items.find(x=>x.id===id);
 const scrapCat=d.categories.find(x=>x.id==='C07')?.name||'報廢';
 if(!code||!name||!reason)return'請填寫編號、名稱與變更原因';
 if(items.some(y=>y.id!==id&&y.id===code))return'編號重複';
 if(items.some(y=>y.id!==id&&y.name===name&&(type==='category'||(y.category===cat&&(type!=='group'||y.subcategory===sub)))))return'此層級名稱重複';
 if(type!=='category'&&!d.categories.some(c=>c.name===cat))return'請選擇有效類別';
 if(type==='group'&&!d.subcategories.some(s=>s.category===cat&&s.name===sub))return'請選擇此類別下的子類別';
 if((id==='C07'&&name!==scrapCat)||(id==='SC-SCRAP'&&(name!=='報廢'||cat!==scrapCat))||(id==='TG-SCRAP'&&(name!=='報廢'||cat!==scrapCat||sub!=='報廢')))return'報廢保留分類不可改名或移出';
 if(type!=='category'&&cat===scrapCat&&!['SC-SCRAP','TG-SCRAP'].includes(id))return'報廢區保留供正式報廢流程使用，不可透過分類編輯移入';
 if(type==='group'&&id!=='TG-SCRAP'&&!spec)return'請填寫規格能力';
 if(type==='group'&&id!=='TG-SCRAP'&&old&&old.spec!==spec&&d.equipment.some(r=>r.group===id)&&!checked)return'能力要求已變更，請先核對修改內容';
 return'';
}
function equipmentEditError(r,old,d){

 if(!g||g.category!==r.category||g.subcategory!==r.subcategory)return'類別、子類別與群組不一致';
 if(isScrapped(r)&&(!old||!isScrapped(old)))return'報廢區已預留，正式報廢流程尚未建立；目前不可直接新增或移入真實設備';
 if(old&&isScrapped(old)&&r.group!=='TG-SCRAP')return'報廢設備不可直接改回可用分類';

 if(!String(r.mark||'').trim())return'請填寫同資產分件編號';
 if(r.review?.resolved&&!String(r.review.note||'').trim())return'請填寫核對依據／處理結果';
 return'';
}

const pieceNumberLedger=new Map();
const assetNumberKey=value=>String(value||'').trim().toUpperCase();
const pieceNumberKey=value=>String(value||'').trim().toUpperCase();
function numberingRecords(){return [...versions.flatMap(v=>v.data.equipment),...(work?.equipment||[])]}
function reservePieceNumber(r){
 const asset=assetNumberKey(r.id),piece=pieceNumberKey(r.mark);if(!asset||!piece)return;
 if(!pieceNumberLedger.has(asset))pieceNumberLedger.set(asset,new Map());
 const numbers=pieceNumberLedger.get(asset);if(!numbers.has(piece))numbers.set(piece,new Set());numbers.get(piece).add(r.key);
}
function nextPieceNumber(asset,records=numberingRecords(),ledger=pieceNumberLedger){
 const key=assetNumberKey(asset);if(!key)return'';
 const used=new Set(records.filter(r=>assetNumberKey(r.id)===key).map(r=>pieceNumberKey(r.mark)));
 for(const mark of ledger.get(key)?.keys()||[])used.add(mark);
 let max=0;for(const mark of used){const prefix=mark.match(/^(\d+)/);if(prefix)max=Math.max(max,Number(prefix[1]))}
 let next=max+1;while(used.has(String(next).padStart(2,'0')))next++;
 return String(next).padStart(2,'0');
}
function pieceNumberTaken(r){
 const same=x=>x.key!==r.key&&assetNumberKey(x.id)===assetNumberKey(r.id)&&pieceNumberKey(x.mark)===pieceNumberKey(r.mark);
 if(numberingRecords().some(same))return true;
 const owners=pieceNumberLedger.get(assetNumberKey(r.id))?.get(pieceNumberKey(r.mark));
 return owners?[...owners].some(key=>key!==r.key):false;
}
let equipmentKeyCounter=Math.max(0,...numberingRecords().map(r=>Number(r.key)||0));
function newEquipmentKey(){equipmentKeyCounter=Math.max(equipmentKeyCounter,...numberingRecords().map(r=>Number(r.key)||0))+1;return equipmentKeyCounter}
function bindAutoPieceNumber(r){
 const old=data().equipment.find(x=>x.key===r.key),asset=root.querySelector('[data-key="id"]'),piece=root.querySelector('[data-key="mark"]');
 if(!asset||!piece)return;
 piece.readOnly=true;piece.oninput=null;piece.setAttribute('aria-readonly','true');piece.placeholder='先填固定資產編號';
 const note=document.createElement('small');note.className='auto-number-note';note.textContent=old?'既有編號保留，不隨排序或報廢改號。':'系統自動編號，儲存草稿時確定；報廢號碼不重用。';piece.after(note);
 const update=()=>{r.mark=old?old.mark:nextPieceNumber(r.id);piece.value=r.mark};
 const handler=asset.oninput;asset.oninput=e=>{handler?.(e);update()};update();
}

// Prototype review checklist and browser-local draft recovery. The review
// platform block is an explicit preview; no remote API is connected here.
let submissionProblems=[],submissionCheckOpen=false,reviewPreview=[],platformPreviewOpen=false;
let draftStoreReady=false,draftStoreStatus='正在檢查本機草稿…';
function draftReviewProblems(){
 if(!work)return[];
 const base=versions.at(-1).data,issues=[];
 const add=(kind,id,label,field,message,channel)=>issues.push({kind,id,label,field,message,channel});
 for(const r of work.equipment){
  const old=base.equipment.find(x=>x.key===r.key);
  if(old&&JSON.stringify(old)===JSON.stringify(r))continue;
  const label=[r.id||'未編號',r.mark||'未分件',r.name||'未命名'].join(' · ');
  for(const [name,value,field] of [['固定資產編號',r.id,'id'],['同資產分件編號',r.mark,'mark'],['設備名稱',r.name,'name'],['類別',r.category,'category'],['子類別',r.subcategory,'subcategory'],['規格群組',r.group,'group'],['保管人／部門',r.owner,'owner'],['單位',r.unit,'unit'],['入庫日期',r.intake,'intake'],['規格／用途',r.spec,'spec'],['設備照片',r.photo,'photo'],['校正方式',r.method,'calmethod']]){
   if(!String(value??'').trim())add('equipment',r.key,label,field,name+'未填寫');
  }
  if(r.group){const g=work.groups.find(g=>g.id===r.group);if(!g||g.category!==r.category||g.subcategory!==r.subcategory)add('equipment',r.key,label,'group','類別、子類別與規格群組不一致')}
  if(r.method!=='不校正'){
   const channels=r.method==='內部＋外部'?['內部','外部']:[r.method];
   for(const type of channels){const channel=r.channels?.find(c=>c.type===type);for(const [name,field,value] of [['校正週期','cycle',channel?.cycle],['最近校正日期','last',channel?.last],['校正有效期限','expiry',channel?.expiry]])if(!String(value??'').trim())add('equipment',r.key,label,field,type+name+'未填寫',type)}
  }
 }
 for(const [kind,items,oldItems] of [['category',work.categories,base.categories],['subcategory',work.subcategories,base.subcategories],['group',work.groups,base.groups]]){
  for(const item of items){
   const old=oldItems.find(x=>x.id===item.id);
   if(old)continue; // Imported rows have a separate historic cleanup queue.
   const name={category:'類別',subcategory:'子類別',group:'規格群組'}[kind];
   if(!item.id?.trim())add(kind,item.id,item.name||'新'+name,'mid',name+'編號未填寫');
   if(!item.name?.trim())add(kind,item.id,item.id||'新'+name,'mname',name+'名稱未填寫');
   if(kind==='group'&&item.id!=='TG-SCRAP'&&!item.spec?.trim())add(kind,item.id,item.name,'mspec','規格能力未填寫');
   if(!item.image)add(kind,item.id,item.name,'manager-image','代表圖片未上傳');
  }
 }
 return issues;
}
function goToSubmissionProblem(index){
 const issue=submissionProblems[index];if(!issue)return;
 if(issue.kind==='equipment'){
  equipmentForm(issue.id);
  const channelIndex=issue.channel?root.querySelector('#calmethod')?.value==='內部＋外部'&&issue.channel==='外部'?1:0:0;
  const field=issue.field==='photo'?'#photo':issue.field==='group'?'#group + .picker-trigger':issue.field==='category'?'#category + .picker-trigger':issue.field==='subcategory'?'#equipment-subcategory + .picker-trigger':issue.field==='calmethod'?'#calmethod':['cycle','last','expiry'].includes(issue.field)?`[data-channel="${channelIndex}"][data-prop="${issue.field}"]`:'[data-key="'+issue.field+'"]';
  const target=root.querySelector(field);target?.scrollIntoView({block:'center',behavior:'smooth'});target?.focus?.({preventScroll:true});
 }else{
  managing=true;manageEdit={type:issue.kind,id:issue.id};
  const record=issue.kind==='category'?work.categories.find(c=>c.id===issue.id):issue.kind==='subcategory'?work.subcategories.find(s=>s.id===issue.id):work.groups.find(g=>g.id===issue.id);
  if(issue.kind==='category'){managerCategory=record?.name||'';managerSubcategory=''}
  else{managerCategory=record?.category||'';managerSubcategory=issue.kind==='group'?record?.subcategory||'':''}
  list();const target=root.querySelector(issue.field==='manager-image'?'#manager-image':issue.field==='mspec'?'#mspec':'[data-key="'+issue.field+'"]');
  target?.scrollIntoView({block:'center',behavior:'smooth'});target?.focus?.({preventScroll:true});
 }
}
function renderDraftReviewPanels(){
 root.querySelector('#draft-submit-check')?.remove();root.querySelector('#quality-review-preview')?.remove();
 const issue=root.querySelector('#review-register'),listing=root.querySelector('#listing');if(!listing)return;

 errors.innerHTML=`<summary>送審前檢查 · ${submissionProblems.length?submissionProblems.length+' 項待修正':'可展開查看範例'}</summary>${submissionProblems.length?
  `<p class="error">尚未送出。請逐項修正後再按「送出審核」。</p><div class="draft-issue-list">${submissionProblems.map((x,i)=>`<div class="draft-issue-row"><div><strong>${esc(x.label)}</strong><small>${esc(x.message)}</small></div><button type="button" data-fix-issue="${i}">前往修正</button></div>`).join('')}</div>`:
  `<p>只有本次新增或修改的資料會進入送審檢查；原匯入資料沿用上方「待確認清單」逐筆核對。</p><details><summary>顯示錯誤範例（示意資料）</summary><div class="draft-issue-row"><div><strong>示意設備 · DEMO-01</strong><small>保管人／部門未填寫</small></div><span>前往修正</span></div><div class="draft-issue-row"><div><strong>示意設備 · DEMO-01</strong><small>設備照片未上傳</small></div><span>前往修正</span></div></details>`}`;
 (issue||listing.firstElementChild).after(errors);
 errors.ontoggle=()=>{if(errors.isConnected)submissionCheckOpen=errors.open};
 errors.querySelectorAll('[data-fix-issue]').forEach(b=>b.onclick=()=>goToSubmissionProblem(Number(b.dataset.fixIssue)));
 const platform=document.createElement('details');platform.className='panel quality-review-preview';platform.id='quality-review-preview';
 platform.open=platformPreviewOpen||reviewPreview.some(r=>r.status==='待確認');
 platform.innerHTML=`<summary>版本確認平台預覽 · 品質系統資料庫 <span class="review-count">${reviewPreview.filter(r=>r.status==='待確認').length} 筆待確認</span></summary><p class="muted">示意畫面：送審成功後的設備草稿會顯示於此。尚未連接正式品質系統資料庫。</p>${reviewPreview.length?reviewPreview.map(r=>`<div class="review-preview-row"><strong>${esc(r.title)}</strong><span>${esc(r.status)}</span><small>${esc(r.at)}</small></div>`).join(''):'<div class="review-preview-row"><strong>示意：檢具與測試設備草稿</strong><span>待確認</span><small>成功送審後會產生實際待確認項目</small></div>'}<details class="persistence-note"><summary>草稿與照片存放規劃 · D1 / R2</summary><p>目前：本機 IndexedDB 儲存草稿與照片，僅同一瀏覽器可還原；沒有 D1、R2 綁定，跨電腦與跨瀏覽器尚無法保證。</p><p>正式接線：D1 儲存草稿、修訂號、送審狀態、版本及核對記錄；R2 儲存照片，D1 只存 R2 物件鍵。使用者身分與權限由正式網站驗證。</p></details></details>`;
 errors.after(platform);
 platform.ontoggle=()=>{if(platform.isConnected)platformPreviewOpen=platform.open};
 const status=root.querySelector('#draft-storage-indicator')||document.createElement('small');status.id='draft-storage-indicator';status.textContent=draftStoreStatus;
 root.querySelector('#evg-screen > .panel .bar')?.append(status);
}
const listBeforeDraftReview=list;
list=function(){listBeforeDraftReview();if(work&&submissionProblems.length)submissionProblems=draftReviewProblems();renderDraftReviewPanels();renderWorkflowControls();if(draftStoreReady)persistDraftState()};
const enhanceBeforeDraftValidation=enhanceForm;
enhanceForm=function(key){enhanceBeforeDraftValidation(key);root.querySelectorAll('.calibration-prominent [data-prop="last"],.calibration-prominent [data-prop="expiry"]').forEach(el=>{el.parentElement.firstChild.textContent=el.dataset.prop==='last'?'最近校正日期（送審必填）':'校正有效期限（送審必填）'})};
root.addEventListener('click',e=>{
 if(e.target.closest('#submit')){
  if(!writable())return;
  submissionProblems=draftReviewProblems();submissionCheckOpen=!!submissionProblems.length;
  if(submissionProblems.length){e.preventDefault();e.stopImmediatePropagation();list();root.querySelector('#draft-submit-check')?.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(changes.length)queueMicrotask(()=>{if(state==='pending'){reviewPreview.unshift({title:'檢具與測試設備 · V'+(versions.at(-1).n+1)+' · '+changes.length+' 項變更',version:versions.at(-1).n+1,at:workflowNow(),status:'待確認'});list()}});
 }

},true);

// Draft and supervisor review preview. Released versions remain immutable.
let draftSavedAt='',reviewHistory=[];
const workflowNow=()=>new Date().toLocaleString('zh-TW',{timeZone:'Asia/Ho_Chi_Minh',hour12:false});
function pendingCase(){return reviewPreview.find(item=>item.status==='待確認')}
function renderWorkflowControls(){
 const panel=root.querySelector('#evg-screen > .panel'),bar=panel?.querySelectorAll('.bar')[1],version=root.querySelector('#version');if(!bar||!version)return;
 const current=versions.at(-1),draftNumber=current.n+1;
 for(const option of version.options){if(option.value==='draft')option.textContent=`V${draftNumber} · ${state==='pending'?'主管審核中':state==='returned'?'發回修改':'草稿'} · ${draftSavedAt||'尚未儲存'}`;else if(option.value!=='current'){const v=versions.find(v=>String(v.n)===option.value);if(v)option.textContent=`V${v.n} · ${v.n===1?'匯入基準':'已核准'} · ${v.approvedAt||v.date}`}}
 const title=panel.querySelector('h3');if(view==='draft'&&title)title.textContent=`目前查閱 V${draftNumber} · ${state==='pending'?'主管審核中':state==='returned'?'發回修改':'草稿'}`;
 panel.querySelector('small:not(#draft-storage-indicator)')?.insertAdjacentHTML('beforebegin',`<p class="workflow-timestamp">${view==='draft'?'草稿儲存：'+esc(draftSavedAt||'尚未手動儲存')+(state==='pending'?' · 送審：'+esc(pendingCase()?.at||'處理中'):''):'目前生效：V'+current.n+' · '+esc(current.approvedAt||current.date)}。舊版可在上方選單唯讀查看；只有新草稿可以修改。</p>`);
 const startButton=root.querySelector('#start');if(startButton){startButton.textContent=work?'繼續修改 V'+draftNumber:'開始修改／刪除資料';if(state==='pending')startButton.remove()}
 const submit=root.querySelector('#submit');if(submit)submit.textContent='送出主管審核';
 if(writable()){const save=document.createElement('button');save.id='save-draft';save.type='button';save.textContent='儲存草稿';bar.querySelector('.row:last-child')?.prepend(save);save.onclick=()=>{draftSavedAt=workflowNow();log('儲存 V'+draftNumber+' 草稿');list()}}
 if(state==='pending'&&view==='draft'&&role==='editor'){
  const row=bar.querySelector('.row:last-child');const withdraw=document.createElement('button');withdraw.type='button';withdraw.id='withdraw-review';withdraw.textContent='解除送審，繼續修改';row?.append(withdraw);withdraw.onclick=()=>{const item=pendingCase();if(!item)return;reviewHistory.unshift({...item,status:'已撤回',comment:'建檔人員解除送審',reviewedAt:workflowNow()});reviewPreview=reviewPreview.filter(r=>r!==item);state='draft';draftSavedAt=workflowNow();log('解除 V'+draftNumber+' 送審');list()}
  const inspect=document.createElement('button');inspect.type='button';inspect.textContent='查看送審案件';row?.append(inspect);inspect.onclick=()=>{const target=root.querySelector('#quality-review-preview');if(target){target.open=true;target.scrollIntoView({block:'center',behavior:'smooth'})}}
 }
 root.querySelector('#approve')?.remove();root.querySelector('#reject')?.remove();
 const add=root.querySelector('#add');if(add&&!writable()){add.hidden=true}if(view!=='current'&&view!=='draft')root.querySelector('#editnow')?.remove()
 const platform=root.querySelector('#quality-review-preview');if(!platform)return;
 const caseItem=pendingCase();if(caseItem&&role==='reviewer'){
  const control=document.createElement('div');control.className='review-decision';control.innerHTML=`<label>主管意見（確認與發回都必填）<textarea id="review-comment" placeholder="請填寫確認依據或發回原因"></textarea></label><p class="review-comment-error" role="alert" hidden>請先填寫主管意見。</p><div class="row"><button type="button" id="return-version">發回修改</button><button type="button" class="primary" id="approve-version">確認版本</button></div>`;
  platform.append(control);control.querySelector('#return-version').onclick=()=>reviewDecision('return',control);control.querySelector('#approve-version').onclick=()=>reviewDecision('approve',control)
 }
 if(reviewHistory.length){const history=document.createElement('details');history.innerHTML='<summary>已撤回／發回紀錄 · '+reviewHistory.length+'</summary>'+reviewHistory.map(item=>`<p>V${item.version||'?'} · ${esc(item.status)} · ${esc(item.reviewedAt||'')} · ${esc(item.comment||'')}</p>`).join('');platform.append(history)}
 for(const item of reviewPreview){if(!item.comment)continue;const note=document.createElement('p');note.className='review-comment-note';note.textContent=`${item.status} · ${item.reviewedAt||item.at} · 主管意見：${item.comment}`;platform.append(note)}
}
function reviewDecision(action,control){
 if(role!=='reviewer'||state!=='pending'||!work)return;
 const comment=control.querySelector('#review-comment').value.trim();if(!comment){control.querySelector('.review-comment-error').hidden=false;control.querySelector('#review-comment').focus();return}
 const item=pendingCase();if(!item)return;const time=workflowNow(),number=versions.at(-1).n+1;item.version=number;item.comment=comment;item.reviewedAt=time;
 if(action==='return'){
  item.status='已發回';reviewHistory.unshift({...item});reviewPreview=reviewPreview.filter(r=>r!==item);state='returned';view='draft';draftSavedAt=time;log('主管發回 V'+number+'：'+comment);list();return
 }
 item.status='已核准';versions.push({n:number,data:copy(work),date:today(),approvedAt:time,reviewComment:comment,reason:changes.join('；')});log('主管確認版本 V'+number+'：'+comment);work=null;changes=[];state='';view='current';draftSavedAt='';list();
}

function openDraftStore(){return new Promise((resolve,reject)=>{if(!globalThis.indexedDB)return reject(Error('此瀏覽器不支援本機草稿儲存'));
 const request=indexedDB.open('equipment-ui-drafts',1);request.onupgradeneeded=()=>request.result.createObjectStore('snapshots');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('無法開啟本機草稿'))})}
let draftWriteQueue=Promise.resolve();
function persistDraftState(){
 const snapshot={versions:copy(versions),work:copy(work),state,view,audit:copy(audit),changes:copy(changes),reviewPreview:copy(reviewPreview),reviewHistory:copy(reviewHistory),draftSavedAt,savedAt:new Date().toISOString()};
 draftWriteQueue=draftWriteQueue.catch(()=>{}).then(async()=>{
  try{const db=await openDraftStore();await new Promise((resolve,reject)=>{const transaction=db.transaction('snapshots','readwrite');transaction.objectStore('snapshots').put(snapshot,'current');transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)});db.close();draftStoreStatus='本機草稿已保存 · 跨裝置待連接 D1 / R2';const label=root.querySelector('#draft-storage-indicator');if(label)label.textContent=draftStoreStatus
  }catch(e){draftStoreStatus='本機草稿保存失敗：'+e.message;const label=root.querySelector('#draft-storage-indicator');if(label)label.textContent=draftStoreStatus}
 });return draftWriteQueue;
}
async function restoreDraftState(){
 try{const db=await openDraftStore();const record=await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly'),request=tx.objectStore('snapshots').get('current');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();
  if(record?.versions?.length&&record.versions[0]?.data?.equipment?.length===versions[0].data.equipment.length){versions=record.versions;work=record.work;state=record.state;view=record.view;audit=record.audit||[];changes=record.changes||[];reviewPreview=record.reviewPreview||[];reviewHistory=record.reviewHistory||[];draftSavedAt=record.draftSavedAt||'';for(const item of versions.flatMap(v=>v.data.equipment).concat(work?.equipment||[]))reservePieceNumber(item);draftStoreStatus='已還原本機草稿 · 跨裝置待連接 D1 / R2'}
  else draftStoreStatus='本機草稿儲存可用 · 跨裝置待連接 D1 / R2';
 }catch(e){draftStoreStatus='本機草稿不可用：'+e.message}
 draftStoreReady=true;list();
}
restoreDraftState();

installExcelTransfer();

category='';
search='';
list();
