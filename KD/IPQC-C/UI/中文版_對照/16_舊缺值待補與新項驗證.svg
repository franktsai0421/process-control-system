<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Arial',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F5F7F6" stroke="none" stroke-width="1" /><rect x="0" y="0" width="220" height="900" rx="0" fill="#112823" stroke="none" stroke-width="1" /><text x="22" y="40" fill="#FFFFFF" font-size="21" font-weight="700">品質管理</text><text x="22" y="62" fill="#9FC7B6" font-size="10" font-weight="600">QUALITY OS</text><text x="30" y="128" fill="#BCD1C8" font-size="15" font-weight="400">總覽</text><text x="30" y="183" fill="#BCD1C8" font-size="15" font-weight="400">標準搜尋</text><text x="30" y="238" fill="#BCD1C8" font-size="15" font-weight="400">品質報告</text><text x="30" y="293" fill="#BCD1C8" font-size="15" font-weight="400">例行檢查</text><text x="30" y="348" fill="#BCD1C8" font-size="15" font-weight="400">版本確認平台</text><text x="30" y="403" fill="#BCD1C8" font-size="15" font-weight="400">製程編輯台</text><rect x="12" y="429" width="196" height="43" rx="7" fill="#204039" stroke="none" stroke-width="1" /><text x="30" y="458" fill="#FFFFFF" font-size="15" font-weight="700">資料後台</text><rect x="220" y="0" width="1220" height="70" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><text x="252" y="43" fill="#65767B" font-size="14" font-weight="400">資料後台  ›  品質系統  ›  IPQC-C</text><text x="251" y="108" fill="#1B3135" font-size="25" font-weight="700">舊缺值待補與新項驗證</text><text x="252" y="135" fill="#65767B" font-size="13" font-weight="400">保留舊資料原貌；新項目需填必要欄位，不適用要明確記錄。</text><text x="252" y="870" fill="#65767B" font-size="12" font-weight="400">IPQC-C UI 設計稿｜示意資料｜實際欄位與規則見同包 MD</text><rect x="252" y="157" width="1158" height="77" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="190" fill="#1B3135" font-size="15" font-weight="700">目前生效 V1</text><rect x="378" y="171" width="161" height="25" rx="13" fill="#FFF0EB" stroke="none" stroke-width="1" /><text x="387" y="188" fill="#E85B3F" font-size="12" font-weight="600">V2 草稿 · 可編輯</text><text x="270" y="216" fill="#65767B" font-size="12" font-weight="400">修改者 Demo Admin · 尚未送審</text><rect x="1009" y="177" width="119" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1022" y="201" fill="#1B3135" font-size="13" font-weight="600">儲存草稿</text><rect x="1138" y="177" width="117" height="36" rx="6" fill="#E85B3F" stroke="none" stroke-width="1" /><text x="1151" y="201" fill="#FFFFFF" font-size="13" font-weight="600">送出審核</text><rect x="252" y="248" width="1158" height="581" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="278" fill="#1B3135" font-size="16" font-weight="700">欄位檢查 · 送審前</text><rect x="270" y="302" width="1120" height="158" rx="8" fill="#FFF0EB" stroke="none" stroke-width="1" /><text x="291" y="337" fill="#1B3135" font-size="17" font-weight="700">舊資料 · 可保留待補</text><text x="291" y="372" fill="#1B3135" font-size="14" font-weight="400">C-3030101-PREP-L1-02：原始資料的檢驗頻率為空。</text><rect x="291" y="392" width="44" height="25" rx="13" fill="#FFF0EB" stroke="none" stroke-width="1" /><text x="300" y="409" fill="#E85B3F" font-size="12" font-weight="600">待補</text><text x="381" y="411" fill="#65767B" font-size="13" font-weight="400">修改其他欄位時不會被自動補值；後續可明確填寫。</text><rect x="270" y="480" width="1120" height="177" rx="8" fill="#FFF0EF" stroke="none" stroke-width="1" /><text x="291" y="516" fill="#B83D36" font-size="17" font-weight="700">新項目 · 阻止送審</text><text x="291" y="550" fill="#1B3135" font-size="14" font-weight="400">C-3030101-PREP-L1-03：檢驗方法未填寫。</text><text x="291" y="582" fill="#65767B" font-size="13" font-weight="400">填入內容，或選「不適用」並留下原因；草稿仍可暫存。</text><rect x="1163" y="600" width="207" height="36" rx="6" fill="#E85B3F" stroke="none" stroke-width="1" /><text x="1176" y="624" fill="#FFFFFF" font-size="13" font-weight="600">返回編輯新項目</text><rect x="1184" y="749" width="192" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1197" y="773" fill="#1B3135" font-size="13" font-weight="600">送審（目前停用）</text></svg>