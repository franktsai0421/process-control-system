<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:'Arial','Noto Sans',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F5F7F6" stroke="none" stroke-width="1" /><rect x="0" y="0" width="220" height="900" rx="0" fill="#112823" stroke="none" stroke-width="1" /><text x="22" y="40" fill="#FFFFFF" font-size="21" font-weight="700">Quản lý chất lượng</text><text x="22" y="62" fill="#9FC7B6" font-size="10" font-weight="600">QUALITY OS</text><text x="30" y="128" fill="#BCD1C8" font-size="15" font-weight="400">Tổng quan</text><text x="30" y="183" fill="#BCD1C8" font-size="15" font-weight="400">Tra cứu tiêu chuẩn</text><text x="30" y="238" fill="#BCD1C8" font-size="15" font-weight="400">Báo cáo chất lượng</text><text x="30" y="293" fill="#BCD1C8" font-size="15" font-weight="400">Kiểm tra định kỳ</text><text x="30" y="348" fill="#BCD1C8" font-size="15" font-weight="400">Duyệt phiên bản</text><text x="30" y="403" fill="#BCD1C8" font-size="15" font-weight="400">Chỉnh sửa quy trình</text><rect x="12" y="429" width="196" height="43" rx="7" fill="#204039" stroke="none" stroke-width="1" /><text x="30" y="458" fill="#FFFFFF" font-size="15" font-weight="700">Quản lý dữ liệu</text><rect x="220" y="0" width="1220" height="70" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><text x="252" y="43" fill="#65767B" font-size="14" font-weight="400">Quản lý dữ liệu  ›  Chất lượng  ›  IPQC-C</text><text x="251" y="108" fill="#1B3135" font-size="25" font-weight="700">Phiên bản và lịch sử</text><text x="252" y="135" fill="#65767B" font-size="13" font-weight="400">So sánh phiên bản hiện hành và cũ; chỉ sửa trong bản nháp.</text><text x="252" y="870" fill="#65767B" font-size="12" font-weight="400">Giao diện minh họa IPQC-C · Xem quy tắc trong tài liệu kèm theo</text><rect x="252" y="157" width="1158" height="77" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="190" fill="#1B3135" font-size="15" font-weight="700">Phiên bản hiện hành V1</text><rect x="378" y="171" width="70" height="25" rx="13" fill="#EFF2F2" stroke="none" stroke-width="1" /><text x="387" y="188" fill="#65767B" font-size="12" font-weight="600">Chỉ xem</text><text x="270" y="216" fill="#65767B" font-size="12" font-weight="400">Đồng bộ với dữ liệu đang có hiệu lực</text><rect x="1009" y="177" width="119" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1022" y="201" fill="#1B3135" font-size="13" font-weight="600">Bắt đầu sửa</text><rect x="252" y="248" width="1158" height="581" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="278" fill="#1B3135" font-size="16" font-weight="700">Lịch sử phiên bản</text><rect x="1097" y="265" width="129" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1110" y="289" fill="#1B3135" font-size="13" font-weight="600">Hiện hành V2</text><rect x="1238" y="265" width="151" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1251" y="289" fill="#1B3135" font-size="13" font-weight="600">Phiên bản cũ V1</text><text x="271" y="328" fill="#1B3135" font-size="16" font-weight="700">Hạng mục · C-3030101-PREP-L1-01</text><rect x="270" y="357" width="1120" height="54" rx="7" fill="#EAF2F7" stroke="none" stroke-width="1" /><text x="289" y="389" fill="#1B3135" font-size="14" font-weight="700">Trường</text><text x="593" y="389" fill="#1B3135" font-size="14" font-weight="700">V1 · Cũ</text><text x="983" y="389" fill="#1B3135" font-size="14" font-weight="700">V2 · Hiện hành</text><rect x="270" y="411" width="1120" height="72" rx="4" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="289" y="454" fill="#1B3135" font-size="14" font-weight="400">Tiêu chuẩn kiểm tra</text><text x="593" y="454" fill="#65767B" font-size="14" font-weight="400">90°C ± 5°C</text><text x="983" y="454" fill="#E85B3F" font-size="14" font-weight="700">91°C ± 5°C</text><rect x="270" y="485" width="1120" height="72" rx="4" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="289" y="528" fill="#1B3135" font-size="14" font-weight="400">Tần suất kiểm tra</text><text x="593" y="528" fill="#65767B" font-size="14" font-weight="400">Mỗi 2 giờ</text><text x="983" y="528" fill="#1B3135" font-size="14" font-weight="400">Mỗi 2 giờ</text><rect x="270" y="559" width="1120" height="72" rx="4" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="289" y="602" fill="#1B3135" font-size="14" font-weight="400">Dụng cụ / thiết bị</text><text x="593" y="602" fill="#65767B" font-size="14" font-weight="400">Nhiệt kế</text><text x="983" y="602" fill="#1B3135" font-size="14" font-weight="400">Nhiệt kế điện tử</text><text x="271" y="737" fill="#65767B" font-size="13" font-weight="400">Phiên bản cũ chỉ xem; giữ nội dung và ảnh lúc đó.</text></svg>