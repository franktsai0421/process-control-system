<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:'Arial','Noto Sans',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F5F7F6" stroke="none" stroke-width="1" /><rect x="0" y="0" width="220" height="900" rx="0" fill="#112823" stroke="none" stroke-width="1" /><text x="22" y="40" fill="#FFFFFF" font-size="21" font-weight="700">Quản lý chất lượng</text><text x="22" y="62" fill="#9FC7B6" font-size="10" font-weight="600">QUALITY OS</text><text x="30" y="128" fill="#BCD1C8" font-size="15" font-weight="400">Tổng quan</text><text x="30" y="183" fill="#BCD1C8" font-size="15" font-weight="400">Tra cứu tiêu chuẩn</text><text x="30" y="238" fill="#BCD1C8" font-size="15" font-weight="400">Báo cáo chất lượng</text><text x="30" y="293" fill="#BCD1C8" font-size="15" font-weight="400">Kiểm tra định kỳ</text><text x="30" y="348" fill="#BCD1C8" font-size="15" font-weight="400">Duyệt phiên bản</text><text x="30" y="403" fill="#BCD1C8" font-size="15" font-weight="400">Chỉnh sửa quy trình</text><rect x="12" y="429" width="196" height="43" rx="7" fill="#204039" stroke="none" stroke-width="1" /><text x="30" y="458" fill="#FFFFFF" font-size="15" font-weight="700">Quản lý dữ liệu</text><rect x="220" y="0" width="1220" height="70" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" /><text x="252" y="43" fill="#65767B" font-size="14" font-weight="400">Quản lý dữ liệu  ›  Chất lượng  ›  IPQC-C</text><text x="251" y="108" fill="#1B3135" font-size="25" font-weight="700">Cảnh báo dữ liệu gốc thay đổi</text><text x="252" y="135" fill="#65767B" font-size="13" font-weight="400">Sản phẩm và công đoạn từ dữ liệu gốc; lệch thì chỉ cảnh báo.</text><text x="252" y="870" fill="#65767B" font-size="12" font-weight="400">Giao diện minh họa IPQC-C · Xem quy tắc trong tài liệu kèm theo</text><rect x="252" y="157" width="1158" height="77" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="190" fill="#1B3135" font-size="15" font-weight="700">Phiên bản hiện hành V1</text><rect x="378" y="171" width="161" height="25" rx="13" fill="#FFF0EB" stroke="none" stroke-width="1" /><text x="387" y="188" fill="#E85B3F" font-size="12" font-weight="600">Bản nháp V2 · có thể sửa</text><text x="270" y="216" fill="#65767B" font-size="12" font-weight="400">Người sửa Demo Admin · chưa gửi duyệt</text><rect x="1009" y="177" width="119" height="36" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="1022" y="201" fill="#1B3135" font-size="13" font-weight="600">Lưu bản nháp</text><rect x="1138" y="177" width="117" height="36" rx="6" fill="#E85B3F" stroke="none" stroke-width="1" /><text x="1151" y="201" fill="#FFFFFF" font-size="13" font-weight="600">Gửi duyệt</text><rect x="252" y="248" width="1158" height="581" rx="10" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="270" y="278" fill="#1B3135" font-size="16" font-weight="700">Thay đổi dữ liệu gốc · Sai liên kết</text><rect x="271" y="311" width="1117" height="146" rx="8" fill="#FFF0EF" stroke="none" stroke-width="1" /><text x="292" y="347" fill="#B83D36" font-size="18" font-weight="700">Cần kiểm tra 2 tiêu chuẩn</text><text x="292" y="383" fill="#1B3135" font-size="14" font-weight="400">Sản phẩm hoặc công đoạn không khớp dữ liệu gốc dây chuyền C.</text><text x="292" y="413" fill="#65767B" font-size="13" font-weight="400">Kiểm tra dữ liệu gốc; lịch sử tiêu chuẩn vẫn được giữ.</text><rect x="272" y="488" width="1116" height="78" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="290" y="517" fill="#1B3135" font-size="14" font-weight="700">Tiêu chuẩn C-3051201B-KHOAN-L1 · 3051201B</text><text x="290" y="544" fill="#B83D36" font-size="13" font-weight="400">Sản phẩm không còn trong dây chuyền C</text><rect x="272" y="579" width="1116" height="78" rx="6" fill="#FFFFFF" stroke="#D9E1E1" stroke-width="1" /><text x="290" y="608" fill="#1B3135" font-size="14" font-weight="700">Tiêu chuẩn C-3030101-MIX-L1 · 3030101</text><text x="290" y="635" fill="#B83D36" font-size="13" font-weight="400">Công đoạn không nằm trong tuyến sản phẩm</text></svg>