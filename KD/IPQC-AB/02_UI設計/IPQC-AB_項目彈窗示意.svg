<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1150" viewBox="0 0 1080 1150"><rect width="1080" height="1150" fill="#eff6f2"/><g font-family="Arial, Noto Sans TC, sans-serif"><rect x="120" y="35" width="840" height="1080" rx="8" fill="#ffffff" stroke="#d7e4dd"/><text x="150" y="78" fill="#173229" font-size="25" font-weight="bold">新增／修改檢查項目</text><text x="150" y="112" fill="#173229" font-size="17" font-weight="bold">檢查項目編號（自動編碼，不重用）</text><rect x="150" y="122" width="780" height="55" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="190" fill="#173229" font-size="17" font-weight="bold">IPQC 項目標準（越文）</text><rect x="150" y="200" width="780" height="90" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="305" fill="#173229" font-size="17" font-weight="bold">項目標準照片（可多張，列表顯示縮圖）</text><rect x="150" y="315" width="780" height="76" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="395" fill="#173229" font-size="17" font-weight="bold">檢查方式敘述（必填，有產品分配時擋正式送審）</text><rect x="150" y="405" width="780" height="90" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="500" fill="#173229" font-size="17" font-weight="bold">檢查方式圖片（可多張，列表顯示縮圖）</text><rect x="150" y="510" width="780" height="76" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="590" fill="#173229" font-size="17" font-weight="bold">檢查類型：目視 / 從檢具清單選設備（擇一）</text><rect x="150" y="600" width="780" height="66" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="670" fill="#173229" font-size="17" font-weight="bold">項目啟用：YES / NO（獨立於檢查方式）</text><rect x="150" y="680" width="780" height="62" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="750" fill="#173229" font-size="17" font-weight="bold">檢查設備（選設備時必選）</text><rect x="150" y="760" width="780" height="65" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="840" fill="#173229" font-size="17" font-weight="bold">檢查頻率（按批次與按時間，可多條）</text><rect x="150" y="850" width="780" height="90" rx="8" fill="#f9fcfa" stroke="#d7e4dd"/><text x="150" y="1020" fill="#173229" font-size="14" font-weight="normal">相片可點開相簿：上一張 / 下一張；正式版照片須存後端草稿與審核版。</text><rect x="770" y="1040" width="160" height="44" rx="5" fill="#e74f36" stroke="#e74f36"/><text x="796" y="1069" fill="#ffffff" font-size="16" font-weight="bold">儲存草稿</text></g></svg>